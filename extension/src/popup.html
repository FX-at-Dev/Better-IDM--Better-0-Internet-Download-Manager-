<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: dark;
        --accent: #4f8cff;
        --text: #e9eaee;
        --text-2: #a4a8b0;
        --text-3: #6d727b;
        --border: rgba(255, 255, 255, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 340px;
        font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        background: #1d1e22;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px 12px;
      }
      header img {
        width: 28px;
        height: 28px;
        border-radius: 7px;
      }
      header b {
        font-size: 14px;
      }
      #status {
        font-size: 12px;
        color: var(--text-2);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-3);
        margin-left: auto;
      }
      .dot.on {
        background: #3fb67a;
      }
      section {
        padding: 12px 16px;
        border-top: 1px solid var(--border);
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      .actions button {
        flex: 1;
      }
      button {
        height: 32px;
        padding: 0 12px;
        font: 600 12.5px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        color: #fff;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
        background: var(--accent);
      }
      button:hover {
        filter: brightness(1.08);
      }
      button.secondary {
        color: var(--text);
        background: #26272c;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.11);
      }
      h4 {
        margin: 0 0 6px;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-3);
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 34px;
      }
      label {
        color: var(--text);
      }
      input[type="number"],
      input[type="text"] {
        width: 100px;
        height: 28px;
        padding: 0 8px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.11);
        background: #18191c;
        color: inherit;
        font: inherit;
        outline: 0;
      }
      input:focus {
        border-bottom: 2px solid var(--accent);
      }
      .sw {
        position: relative;
        width: 38px;
        height: 20px;
        appearance: none;
        margin: 0;
        border-radius: 20px;
        border: 1px solid var(--text-3);
        cursor: pointer;
      }
      .sw::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--text-2);
        transition: transform 0.15s;
      }
      .sw:checked {
        background: var(--accent);
        border-color: var(--accent);
      }
      .sw:checked::after {
        background: #fff;
        transform: translateX(18px);
      }
      #media .m {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        border-top: 1px solid var(--border);
      }
      #media .m:first-child {
        border-top: 0;
      }
      #media .m span {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
      }
      #media .m button {
        height: 26px;
        padding: 0 10px;
        font-size: 12px;
      }
      .pill {
        font-size: 12px;
        font-weight: 600;
        padding: 2px 9px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-2);
      }
      .pill.on {
        background: rgba(63, 182, 122, 0.16);
        color: #3fb67a;
      }
      .muted {
        color: var(--text-3);
        font-size: 12px;
      }
      details summary {
        cursor: pointer;
        color: var(--text-2);
        font-size: 12px;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/48.png" alt="" />
      <div>
        <b>Prism</b>
        <div id="status">Checking…</div>
      </div>
      <span class="dot" id="dot"></span>
    </header>

    <section class="actions">
      <button id="page">Download video on this page</button>
      <button class="secondary" id="open" style="flex: none">Open Prism</button>
    </section>

    <section>
      <h4>Media files on this page</h4>
      <div id="media"><div class="muted">Nothing found yet. Play the video for a moment.</div></div>
    </section>

    <section>
      <div class="row">
        <span>Take over browser downloads</span>
        <span id="takeover" class="pill">…</span>
      </div>
      <div class="muted">Change this in Prism → Settings → Browser extension.</div>
      <details>
        <summary>Connection</summary>
        <div class="row">
          <label for="port">Port</label>
          <input id="port" type="number" min="1024" max="65535" />
        </div>
        <div class="row">
          <label for="token">Token</label>
          <input id="token" type="text" placeholder="optional" />
        </div>
      </details>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
